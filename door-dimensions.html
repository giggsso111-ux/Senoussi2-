*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#050f1f;color:var(--ink);line-height:1.5;font-family:"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.bg{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,560px);transform:translateX(-50%);background:linear-gradient(180deg,rgba(5,15,31,0) 60%,rgba(5,15,31,.5)),var(--poster) center top/cover no-repeat,#0a1d38}
.shell{position:relative;max-width:560px;margin:0 auto;min-height:100vh;padding:0 14px 26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:8px;justify-content:flex-end;margin:0 -14px;padding:10px 14px}
.ib{min-width:42px;height:42px;padding:0 10px;border-radius:12px;border:1px solid var(--bd);background:rgba(7,22,44,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:700;font-size:15px}
.ib[aria-pressed=true]{background:#fff;color:#0a1d38}
.main{padding-top:calc(max(min(100vw,560px)*.8,40vh) - 62px)}
.notice{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;padding:10px 14px;border-radius:12px;background:#ffd166;color:#3b2a00;font-weight:800;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.notice.in{background:#fff4d1;border:1.5px solid #e0a62b;box-shadow:none}
.card{background:var(--g);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:16px}
.card h2 i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ice);color:#06223d;font-style:normal;font-weight:800;display:grid;place-items:center;font-size:14px}
.chips{display:grid;gap:9px}
.chip,.mi,.dm{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.06);text-align:start;font-weight:600;font-size:15px;transition:.2s}
.chip span{font-size:22px}.chip.on,.dm.on,.mi.on{border-color:var(--ice);background:rgba(143,220,255,.16);box-shadow:0 0 0 3px rgba(143,220,255,.14)}
.in{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.08);color:#fff}
.in::placeholder{color:#8aa4bd}select.in option{color:#000}
.list{display:grid;gap:7px;margin-top:10px;max-height:290px;overflow:auto;padding:2px}
.mi{padding:10px 12px;font-size:14.5px}.mi bdi,.dm bdi,.pill bdi{direction:ltr;unicode-bidi:isolate;flex:1;text-align:start}
.mi small{color:var(--mut);direction:ltr;font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:10px}.pill bdi{font-weight:700}
.btn{border:1px solid var(--bd);background:rgba(255,255,255,.1);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.pri{background:var(--ice);color:#06223d;border-color:var(--ice)}.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}.btn.dng{color:var(--red)}.btn.sm{padding:6px 10px;font-size:13px}
.tag{flex:none;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:rgba(255,255,255,.14)}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{display:block;font-size:13px;color:var(--mut);margin-bottom:9px}.fl .in{margin-top:4px}
.sizes .in{font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.small{font-size:12.5px;color:var(--mut);margin:8px 0 0}
.res-head{display:flex;gap:10px;align-items:center;margin:2px 2px 12px;color:var(--mut);font-size:14px}.res-head bdi{direction:ltr;unicode-bidi:isolate;color:#fff;font-weight:700}
.tcard{background:var(--g);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;border-inline-start:5px solid var(--c);opacity:0;transform:translateY(-16px);animation:dr .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*90ms)}
.tcard.still{animation:none;opacity:1;transform:none}@keyframes dr{to{opacity:1;transform:none}}
.tcard h3{margin:0 0 10px;font-size:15px}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.cell{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 8px;text-align:center}
.lab{display:flex;align-items:center;justify-content:center;min-height:32px;font-size:12px;color:var(--mut);line-height:1.35}
.val{display:block;font-size:26px;font-weight:800;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}.val.neg{color:var(--red)}
.eq{display:none;font-size:11px;color:var(--mut);margin-top:2px}body.eqon .eq{display:block}
.warn{background:rgba(255,154,162,.18);border:1px solid var(--red);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.hint{text-align:center;color:#dbe9f7;padding:16px 10px;background:var(--g);border-radius:14px;margin-bottom:14px;font-size:14.5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.credit{margin-top:6px;text-align:center;direction:ltr;font-size:13px;color:#dbe9f7;letter-spacing:.3px}.credit b{color:#fff}
.toast{position:fixed;left:0;right:0;bottom:24px;margin:auto;width:max-content;max-width:90vw;background:#0a1d38;border:1px solid var(--bd);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:90}.toast.show{opacity:1}
/* editor */
.ed{position:fixed;inset:0;z-index:80;background:rgba(3,10,22,.8);display:flex;justify-content:center}
.ed>div{width:min(100%,640px);height:100%;background:#0c2140;display:flex;flex-direction:column}
.edh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}.edh h2{flex:1;margin:0;font-size:17px}
.tabs{display:flex;gap:8px;padding:10px 14px 0}.tab{flex:1;padding:9px;border-radius:10px 10px 0 0;border:1px solid var(--bd);background:rgba(255,255,255,.05);font-weight:700}.tab.on{background:var(--ice);color:#06223d}
.edb{flex:1;overflow:auto;padding:14px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.it{border:1px solid var(--bd);border-radius:12px;margin-bottom:9px;background:rgba(255,255,255,.04)}.it>summary{padding:11px 12px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}.it>summary bdi{flex:1;direction:ltr;unicode-bidi:isolate;text-align:start}
.it>div,.it>.fl,.it>.part,.it>.row{margin:0 12px 10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g2 .btn{grid-column:1/-1}
.part{border:1px dashed var(--bd);border-radius:10px;padding:10px}.crow3{display:grid;grid-template-columns:1fr 96px 62px 34px;gap:6px;margin-bottom:6px}.crow3 .in{padding:8px 6px;font-size:14px}
.edf{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:#0c2140}.edf .btn{width:100%;padding:14px;font-size:16px}

 if(S.what=='fr')p=[{t:tr('w_fr'),c:[{l:tr('width'),v:m.fw},{l:tr('side'),v:m.fs},{l:tr('height'),v:m.fh}]}];
 if(S.what=='st')p=[{t:tr('w_st'),c:[{l:tr('length'),v:m.dh==null?null:m.dh-D.off,e:tr('dhx')+' − '+D.off},{l:tr('width'),v:m.dw==null?null:m.dw-D.off,e:tr('Wn')+' − '+D.off}]}];
 if(S.what=='dr'){const d=DM(),H=num(S.dh),W=num(S.dw);if(d)p=d.parts.map(x=>({t:L(x.t),c:x.c.map(c=>({l:L(c.l),v:calc(c,H,W),e:eqt(c)}))}))}
 return{m,p}}
function render(anim){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
 $('bLang').textContent=tr('lang');$('q').placeholder=tr('ph');$('bEq').setAttribute('aria-pressed',!!S.eq);document.body.classList.toggle('eqon',!!S.eq);
 $('chips').innerHTML=[['dr','🚪'],['fr','❄️'],['st','🏷️']].map(([k,i])=>`<button class="chip${S.what==k?' on':''}" data-w="${k}"><span>${i}</span>${tr('w_'+k)}</button>`).join('');
 const m=M(),dr=S.what=='dr';
 $('s2').hidden=!S.what;$('hint').hidden=!!(S.what&&m);
 $('pill').hidden=!(m&&!S.pick);$('pick').hidden=!!(m&&!S.pick);
 if(m)$('pill').innerHTML=`<bdi>${esc(m.n)}</bdi><button class="btn sm" data-act="chg">${tr('chg')}</button>`;
 list();
 $('s3d').hidden=!(m&&dr);
 $('dpick').innerHTML=D.dr.map(d=>`<button class="dm${S.door==d.id?' on':''}" data-d="${d.id}"><bdi>${esc(L(d.n))}</bdi><span class="tag">${esc(d.tag||'')}</span></button>`).join('');
 $('s3').hidden=!(m&&S.what);$('sz').hidden=!(m&&dr);
 if(m){$('rn').textContent=m.n;if(document.activeElement.id!='inH')$('inH').value=S.dh;if(document.activeElement.id!='inW')$('inW').value=S.dw;
  const sz=$('sz').querySelector('.small');sz.textContent=(m.dh==null||m.dw==null)?tr('nosize'):tr('sizeHint')}
 fill(anim)}
function list(){const q=S.q.toLowerCase().replace(/\s+/g,'');const a=D.fr.filter(m=>!q||m.n.toLowerCase().replace(/\s+/g,'').includes(q));
 $('list').innerHTML=a.length?a.map(m=>`<button class="mi${S.model==m.id?' on':''}" data-id="${m.id}"><bdi>${esc(m.n)}</bdi><small>${m.dh!=null?m.dh+'×'+m.dw:''}</small></button>`).join(''):`<div class="small">${tr('nom')}</div>`}
const dH=(a,b,y,t,e)=>{const k=y>e?5:-5;return`<line class="ex" x1="${a}" y1="${e}" x2="${a}" y2="${y+k}"/><line class="ex" x1="${b}" y1="${e}" x2="${b}" y2="${y+k}"/><line class="dm" x1="${a}" y1="${y}" x2="${b}" y2="${y}" marker-start="url(#ar)" marker-end="url(#ar)"/><text class="dt" x="${(a+b)/2}" y="${y-4}" text-anchor="middle">${t}</text>`};
const dV=(x,a,b,t,e)=>{const k=x>e?5:-5;return`<line class="ex" x1="${e}" y1="${a}" x2="${x+k}" y2="${a}"/><line class="ex" x1="${e}" y1="${b}" x2="${x+k}" y2="${b}"/><line class="dm" x1="${x}" y1="${a}" x2="${x}" y2="${b}" marker-start="url(#ar)" marker-end="url(#ar)"/><text class="dt" transform="translate(${x-5} ${(a+b)/2}) rotate(-90)" text-anchor="middle">${t}</text>`};
const DEFS='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ar" d="M0 0L10 5L0 10z"/></marker></defs>';
function drDoor(H,W,plain){const s=Math.min(300/W,250/H),w=W*s,h=H*s,vw=Math.max(300,w+90),x=(vw-w)/2+8,y=38,t=plain?0:Math.max(4,Math.min(w,h)*.07),vh=h+y+36;
 const gx=x+t,gy=y+t,gw=w-2*t,gh=h-2*t,d1=Math.min(gw,gh)*.4,d2=Math.min(gw,gh)*.7;
 let g=plain?'':`<rect class="o" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`;
 g+=`<rect class="${plain?'o':'g'}" x="${gx}" y="${gy}" width="${gw}" height="${gh}"/><path class="th" d="M${gx+d1} ${gy}L${gx} ${gy+d1}M${gx+d2} ${gy}L${gx} ${gy+d2}"/>`;
 g+=`<line class="cl" x1="${x-8}" y1="${y+h/2}" x2="${x+w+8}" y2="${y+h/2}"/><line class="cl" x1="${x+w/2}" y1="${y-8}" x2="${x+w/2}" y2="${y+h+8}"/>`;
 g+=dH(x,x+w,y-20,fmt(W),y)+dV(x-22,y,y+h,fmt(H),x);
 return`<svg viewBox="0 0 ${vw} ${vh}" role="img">${DEFS}${g}</svg>`}
function drFr(fw,fs,fh){const mL=36,gap=32,mT=24,mR=20,bot=40,s=Math.min((330-mL-gap-mR)/(fw+fs),(380-mT-gap-bot)/(fs+fh)),w=fw*s,d=fs*s,h=fh*s,cw=mL+w+gap+d+mR,vw=Math.max(300,cw),dx=(vw-cw)/2,xF=mL,xS=xF+w+gap,yT=mT,yF=yT+d+gap,vh=yF+h+bot,pl=h*.09;
 const gx=xF+w*.12,gy=yF+h*.04,gw=w*.78,gh=h-pl-h*.07,db=Math.max(3,d*.14);let g='';
 g+=`<rect class="o" x="${xF}" y="${yT}" width="${w}" height="${d}"/><rect class="g" x="${xF+2}" y="${yT+d-db}" width="${w-4}" height="${db-2}"/><text class="vt" x="${xF+w/2}" y="${yT-7}" text-anchor="middle">${tr('vt')}</text>`;
 g+=`<rect class="o" x="${xF}" y="${yF}" width="${w}" height="${h}"/><line class="o2" x1="${xF}" y1="${yF+h-pl}" x2="${xF+w}" y2="${yF+h-pl}"/><rect class="g" x="${gx}" y="${gy}" width="${gw}" height="${gh}"/>`;
 for(let i=1;i<5;i++)g+=`<line class="th" x1="${gx}" y1="${gy+gh*i/5}" x2="${gx+gw}" y2="${gy+gh*i/5}"/>`;
 g+=`<rect class="o" x="${xF+w*.04}" y="${gy+gh*.3}" width="${Math.max(2,w*.035)}" height="${gh*.3}"/>`;
 for(let i=1;i<4;i++)g+=`<line class="th" x1="${xF+w*.2}" y1="${yF+h-pl+pl*i/4}" x2="${xF+w*.8}" y2="${yF+h-pl+pl*i/4}"/>`;
 g+=`<rect class="o" x="${xS}" y="${yF}" width="${d}" height="${h}"/><line class="o2" x1="${xS}" y1="${yF+h-pl}" x2="${xS+d}" y2="${yF+h-pl}"/><line class="o2" x1="${xS+d*.12}" y1="${yF}" x2="${xS+d*.12}" y2="${yF+h-pl}"/>`;
 g+=dV(xF-20,yF,yF+h,fmt(fh),xF)+dH(xF,xF+w,yF+h+18,fmt(fw),yF+h)+dH(xS,xS+d,yF+h+18,fmt(fs),yF+h);
 g+=`<text class="vt" x="${xF+w/2}" y="${yF+h+34}" text-anchor="middle">${tr('vf')}</text><text class="vt" x="${xS+d/2}" y="${yF+h+34}" text-anchor="middle">${tr('vs')}</text>`;
 return`<svg viewBox="0 0 ${vw} ${vh}" role="img">${DEFS}<g transform="translate(${dx} 0)">${g}</g></svg>`}
function draw(){const m=M();let v='';if(m&&S.what){
 if(S.what=='dr'){const H=num(S.dh),W=num(S.dw);if(H>0&&W>0)v=drDoor(H,W)}
 else if(S.what=='fr'){if(m.fw>0&&m.fs>0&&m.fh>0)v=drFr(m.fw,m.fs,m.fh)}
 else{const a=m.dh==null?0:m.dh-D.off,b=m.dw==null?0:m.dw-D.off;if(a>0&&b>0)v=drDoor(a,b,1)}}
 $('draw').hidden=!v;$('svgw').innerHTML=v}
function fill(anim){const c=cur(),dr=S.what=='dr';let neg=0;draw();
 $('hintD').hidden=!(c&&dr&&!DM());$('act').hidden=!(c&&c.p.length);
 $('tables').innerHTML=c?c.p.map((p,i)=>`<article class="tcard${anim?'':' still'}" style="--i:${i};--c:${COL[i%COL.length]}"><h3><bdi>${esc(p.t)}</bdi></h3><div class="cells">${p.c.map(k=>{const b=isFinite(k.v)&&k.v<0;if(b)neg=1;return`<div class="cell"><span class="lab"><bdi>${esc(k.l)}</bdi></span><b class="val${b?' neg':''}">${fmt(k.v)}</b>${k.e?`<small class="eq">${esc(k.e)}</small>`:''}</div>`}).join('')}</div></article>`).join(''):'';
 $('warn').innerHTML=neg?`<div class="warn">${tr('neg')}</div>`:''}
function summary(){const c=cur(),m=c.m,l=[tr('title')+' – Everest','',`${tr('model')}: ${m.n}`,`${tr('w_'+S.what)}`];
 if(S.what=='dr'){l.push(`${tr('size')}: ${tr('Hn')} ${fmt(num(S.dh))} × ${tr('Wn')} ${fmt(num(S.dw))}`);if(DM())l.push(`${tr('w3')}: ${L(DM().n)}`)}
 l.push('');c.p.forEach(p=>l.push(`${p.t}: `+p.c.map(k=>`${k.l} = ${fmt(k.v)}`).join(' | ')));l.push('','⚠️ '+tr('note'),'Prepared by Senousy Abdelazim');return l.join('\n')}
function toast(t){const e=$('toast');e.classList.remove('act');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2000)}
function pickModel(id){S.model=id;const m=M();S.dh=m.dh==null?'':String(m.dh);S.dw=m.dw==null?'':String(m.dw);S.pick=0;S.q='';$('q').value='';sv();render(true);setTimeout(()=>{const e=$('s3d').hidden?$('s3'):$('s3d');e.style.scrollMarginTop='60px';e.scrollIntoView({behavior:'smooth',block:'start'})},60)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.w){S.what=d.w;S.pick=!M();sv();render(true)}
 else if(d.id&&b.classList.contains('mi'))pickModel(d.id);
 else if(d.act=='chg'){S.pick=1;render();$('q').focus()}
 else if(d.d){S.door=d.d;sv();render(true)}
 else if(b.id=='bLang'){S.lang=S.lang=='ar'?'en':'ar';sv();render();if(!$('ed').hidden)renderEd()}
 else if(b.id=='bEq'){S.eq=S.eq?0:1;sv();render()}
 else if(b.id=='bEd')openEd();
 else if(b.id=='cp'){const t=summary();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()});toast(tr('copied'))}
 else if(b.id=='wa')window.open('https://wa.me/?text='+encodeURIComponent(summary()),'_blank');
 else if(b.id=='pr')window.print()});
$('q').addEventListener('input',e=>{S.q=e.target.value;list()});
[['inH','dh'],['inW','dw']].forEach(([i,k])=>$(i).addEventListener('input',e=>{S[k]=e.target.value;sv();fill(false)}));
/* ---------- editor ---------- */
const ES={tab:'f',open:''};let U='',cfF=null;
function ask(name,fn){cfF=fn;$('cfT').textContent=tr('cfq');$('cfN2').textContent=name||'';$('cfY').textContent=tr('cfy');$('cfN').textContent=tr('cfn');$('cf').hidden=false;$('cfN').focus()}
function cfX(ok){$('cf').hidden=true;const f=cfF;cfF=null;if(ok&&f)f()}
$('cfY').onclick=()=>cfX(1);$('cfN').onclick=()=>cfX(0);$('cf').addEventListener('click',e=>{if(e.target.id=='cf')cfX(0)});document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('cf').hidden)cfX(0)});
function undoBar(snap){const t=$('toast');t.textContent=tr('dok');const b=document.createElement('button');b.className='btn sm';b.textContent=tr('undo');b.onclick=()=>{D=JSON.parse(snap);sv();renderEd();t.classList.remove('show','act')};t.append(b);t.classList.add('show','act');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show','act'),7000)}
function openEd(){ES.tab='f';$('ed').hidden=false;document.body.style.overflow='hidden';renderEd()}
function closeEd(){$('ed').hidden=true;document.body.style.overflow='';if(!M()){S.model='';S.pick=1}if(!DM())S.door='';const m=M();if(m&&S.what=='dr'&&S.dh===''&&m.dh!=null)S.dh=String(m.dh);if(m&&S.what=='dr'&&S.dw===''&&m.dw!=null)S.dw=String(m.dw);sv();render(true)}
function renderEd(){
 document.querySelectorAll('#ed [data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
 $('edT').innerHTML=['f','d'].map(t=>`<button class="tab${ES.tab==t?' on':''}" data-t="${t}">${tr(t=='f'?'tf':'td')}</button>`).join('');
 let h='';
 if(ES.tab=='f'){
  h+=`<div class="row"><input class="in" id="eq2" placeholder="${tr('sq')}"></div><label class="fl">${tr('off')}<input class="in" data-a="off" inputmode="decimal" value="${D.off}"></label>`;
  h+=D.fr.map(m=>`<details class="it" data-s="${esc(m.n.toLowerCase())}" ${ES.open==m.id?'open':''}><summary><bdi>${esc(m.n)||'—'}</bdi><button class="ic" data-a2="delf" data-i="${m.id}" aria-label="${tr('del')}">🗑</button></summary><div class="g2">${[['n','e_n'],['dh','e_dh'],['dw','e_dw'],['fw','e_fw'],['fs','e_fs'],['fh','e_fh']].map(([k,t])=>`<label class="fl">${tr(t)}<input class="in" data-a="fr" data-i="${m.id}" data-k="${k}" ${k=='n'?'':'inputmode="decimal"'} value="${esc(m[k]??'')}"></label>`).join('')}</div></details>`).join('')}
 else{
  h+=D.dr.map((d,i)=>`<details class="it" ${ES.open===d.id?'open':''}><summary><bdi>${esc(L(d.n))}</bdi><span class="tag">${esc(d.tag||'')}</span><button class="ic" data-a2="deld" data-i="${i}" aria-label="${tr('del')}">🗑</button></summary>
  <label class="fl">${tr('e_n')}<input class="in" data-a="dn" data-i="${i}" value="${esc(L(d.n))}"></label><label class="fl">Tag<input class="in" data-a="dg" data-i="${i}" value="${esc(d.tag||'')}"></label>
  ${d.parts.map((p,j)=>`<div class="part"><div class="row"><input class="in" data-a="pt" data-i="${i}" data-p="${j}" value="${esc(L(p.t))}"><button class="ic" data-a2="delp" data-i="${i}" data-p="${j}">✕</button></div>${p.c.map((c,k)=>{const x=`data-i="${i}" data-p="${j}" data-c="${k}"`;return`<div class="crow3"><input class="in" data-a="cl" ${x} value="${esc(L(c.l))}"><select class="in" data-a="ct" ${x}>${TY.map(t=>`<option value="${t}"${c.t==t?' selected':''}>${TL[t]}</option>`).join('')}</select><input class="in" data-a="cn" ${x} inputmode="decimal" value="${c.n}"><button class="ic" data-a2="delc" ${x}>✕</button></div>`}).join('')}<button class="btn sm" data-a2="addc" data-i="${i}" data-p="${j}">＋ ${tr('col')}</button></div>`).join('')}
  <div class="row"><button class="btn sm" data-a2="addp" data-i="${i}">＋ ${tr('part')}</button></div></details>`).join('')}
 h+=`<details class="it"><summary>${tr('bk')}</summary><div><textarea class="in" id="bk"></textarea><div class="row"><button class="btn sm" data-a2="bc">${tr('bc')}</button><button class="btn sm" data-a2="bl">${tr('bl')}</button><button class="btn dng sm" data-a2="rst">${tr('rst')}</button></div></div></details>`;
 $('edB').innerHTML=h;const ab=$('edAdd');ab.textContent='＋ '+tr(ES.tab=='f'?'af':'ad');ab.dataset.a2=ES.tab=='f'?'addf':'addd'}
$('edX').onclick=closeEd;
$('edT').addEventListener('click',e=>{const t=e.target.dataset.t;if(t){ES.tab=t;ES.open='';renderEd()}});
$('edB').addEventListener('input',e=>{const t=e.target,a=t.dataset.a,v=t.value;
 if(t.id=='eq2'){const q=v.toLowerCase();document.querySelectorAll('#edB .it[data-s]').forEach(d=>d.hidden=!d.dataset.s.includes(q));return}
 if(!a)return;const i=t.dataset.i;
 if(a=='off')D.off=num(v)||0;
 else if(a=='fr'){const m=D.fr.find(x=>x.id==i),k=t.dataset.k,n=num(v);m[k]=k=='n'?v:(isNaN(n)?null:n)}
 else{const d=D.dr[+i];if(a=='dn')d.n=sl(d.n,v);else if(a=='dg')d.tag=v;else{const p=d.parts[+t.dataset.p];if(a=='pt')p.t=sl(p.t,v);else{const c=p.c[+t.dataset.c];if(a=='cl')c.l=sl(c.l,v);else if(a=='ct')c.t=v;else if(a=='cn')c.n=num(v)||0}}}
 sv()});
$('ed').addEventListener('click',e=>{const b=e.target.closest('[data-a2]');if(!b)return;e.preventDefault();const a=b.dataset.a2,i=b.dataset.i,p=+b.dataset.p,c=+b.dataset.c;
 if(a=='addf'){const id='f'+Date.now();D.fr.unshift({id,n:'',dh:null,dw:null,fw:null,fs:null,fh:null});ES.open=id}
 else if(a=='delf'){const m=D.fr.find(x=>x.id==i);ask(m&&m.n,()=>{D.fr=D.fr.filter(x=>x.id!=i);sv();renderEd()});return}
 else if(a=='addd'){const d=cl(D.dr[0]||DEF.dr[0]);d.id='d'+Date.now();d.n={ar:'موديل باب جديد',en:'New door model'};d.tag='NEW';D.dr.push(d);ES.open=d.id}
 else if(a=='deld'){ask(L(D.dr[+i].n),()=>{D.dr.splice(+i,1);sv();renderEd()});return}
 else if(a=='addp'){D.dr[+i].parts.push({t:{ar:I.ar.pt,en:I.en.pt},c:[{l:{ar:'الطول',en:'Height'},t:'h',n:0},{l:{ar:'العرض',en:'Width'},t:'w',n:0}]});ES.open=D.dr[+i].id}
 else if(a=='delp'){ask(L(D.dr[+i].parts[p].t),()=>{D.dr[+i].parts.splice(p,1);ES.open=D.dr[+i].id;sv();renderEd()});return}
 else if(a=='addc'){D.dr[+i].parts[p].c.push({l:{ar:I.ar.nc,en:I.en.nc},t:'w',n:0});ES.open=D.dr[+i].id}
 else if(a=='delc'){ask(L(D.dr[+i].parts[p].c[c].l),()=>{D.dr[+i].parts[p].c.splice(c,1);ES.open=D.dr[+i].id;sv();renderEd()});return}
 else if(a=='bc'){const t=JSON.stringify(D);$('bk').value=t;try{navigator.clipboard.writeText(t)}catch(x){}toast(tr('copied'));return}
 else if(a=='bl'){try{const x=JSON.parse($('bk').value);if(!Array.isArray(x.fr)||!Array.isArray(x.dr))throw 0;D=x}catch(x){return}}
 else if(a=='rst'){if(!confirm(tr('conf')))return;D=cl(DEF)}
 sv();renderEd();if(U){undoBar(U);U=''}
 if(a=='addf'){$('edB').scrollTop=0;const f=document.querySelector('#edB details[open] input');f&&f.focus()}
 if(a=='addd'){const o=document.querySelector('#edB details[open]');o&&o.scrollIntoView({block:'center'})}});
render(true);
</script>
</body>
